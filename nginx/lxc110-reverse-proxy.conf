# Ce dépôt ne pousse plus de vhost nginx sur le LXC 110.
# Le trafic public passe par Nginx Proxy Manager (NPM) sur le LXC 110
# (IP LAN typique : 192.168.10.111 — vérifier avec : pct exec 110 -- hostname -I).
#
# Dans NPM : Hosts → Proxy Hosts → Add Proxy Host
#   Domain Names     : jeu.elucidescape.fr
#   Scheme           : http
#   Forward Hostname : 192.168.10.116   (LXC steelcutter, IP fixe après reboot)
#   Forward Port     : 80
#   Websockets       : activé (recommandé pour Vite/React en usage courant)
#   Block Common Exploits : au choix
# SSL : onglet SSL → demander un certificat Let's Encrypt, cocher Force SSL
#
# Pas de « Custom Location » obligatoire : le nginx du LXC steelcutter sert la SPA
# et proxifie déjà /api/ vers Node (voir steelcutter.conf).
