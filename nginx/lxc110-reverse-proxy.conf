# Config à ajouter sur LXC 110 (nginx reverse proxy) pour jeu.elucidescape.fr
# Remplace <LXC_STEELCUTTER_IP> par l'IP du LXC steelcutter (ex: 192.168.1.111)

server {
    listen 80;
    server_name jeu.elucidescape.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name jeu.elucidescape.fr;

    # Certificat SSL (Let's Encrypt via certbot ou déjà en place)
    ssl_certificate     /etc/letsencrypt/live/jeu.elucidescape.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jeu.elucidescape.fr/privkey.pem;

    location / {
        proxy_pass         http://<LXC_STEELCUTTER_IP>:80;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
