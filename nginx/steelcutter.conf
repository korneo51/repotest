server {
    listen 80;
    server_name jeu.elucidescape.fr;

    root /var/www/steelcutter;
    index index.html;

    # Proxy vers l'API Node.js
    location /api/ {
        proxy_pass         http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Fichiers build Vite : jamais de fallback SPA (sinon le navigateur reçoit du HTML
    # pour une URL .js → erreur « Expected a JavaScript module »).
    location ^~ /assets/ {
        root /var/www/steelcutter;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback : toutes les routes React vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compression gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}
